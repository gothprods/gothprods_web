<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ evento.nombre_evento }} | Eventos Destacados | Goth Prods</title>
    <meta name="description" content="No te pierdas {{ evento.nombre_evento }}! {{ evento.bio_corta | truncate(150) }}">
    <meta name="keywords" content="{{ evento.nombre_evento }}, evento, metal, goth prods, concierto">
    <meta name="author" content="Goth Prods">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Redes Sociales (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://gothprods.com/evento/{{ evento.id }}">
    <meta property="og:title" content="{{ evento.nombre_evento }} | Eventos Destacados">
    <meta property="og:description" content="{{ evento.bio_corta | truncate(150) }}">
    <meta property="og:image" content="https://gothprods.com/{{ evento.img_video_path | replace(' ', '%20') }}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://gothprods.com/evento/{{ evento.id }}">
    <meta property="twitter:title" content="{{ evento.nombre_evento }} | Eventos Destacados">
    <meta property="twitter:description" content="{{ evento.bio_corta | truncate(150) }}">
    <meta property="twitter:image" content="https://gothprods.com/{{ evento.img_video_path | replace(' ', '%20') }}">

    <!-- Favicons -->
    <link rel="icon" href="/assets/viking.webp" type="image/jpeg">
    <link rel="apple-touch-icon" href="/assets/viking.webp">
    <link rel="stylesheet" href="/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="navbar">
        <div class="left-controls">
            <img src="/assets/viking.webp" alt="Viking Icon" class="viking-icon">
        </div>
        <div class="logo">
            <a href="/"><img src="/assets/logo-new.webp?v=2" alt="Goth Prods Logo" class="logo-img"></a>
        </div>
    </header>

    <main style="padding-top: 100px; min-height: 100vh; background: #000;">
        <div style="max-width: 800px; margin: 0 auto; background: #111; padding: 40px; border: 1px solid var(--accent-color); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
            
            <a href="/" style="color: var(--accent-color); text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; display: inline-block; font-weight: bold;"><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a>
            
            <h2 class="notranslate" style="color: var(--accent-color); font-size: 2.5rem; margin-bottom: 5px; text-align: center; font-family: 'Oswald', sans-serif; text-transform: uppercase;">{{ evento.titulo_articulo }}</h2>
            <h3 style="text-align: center; color: #fff; font-size: 1.5rem; margin-bottom: 10px;">{{ evento.nombre_evento }}</h3>
            <p style="text-align: center; color: #888; font-size: 1.1rem; margin-bottom: 30px;">
                <i class="fa-solid fa-location-dot"></i> {{ evento.ciudad }}, {{ evento.pais }} | 
                <i class="fa-solid fa-calendar-days"></i> {{ evento.fecha_evento }}<br>
                <i class="fa-solid fa-bullhorn"></i> Promotor: {{ evento.promotor }}
            </p>

            <div style="text-align: center; margin-bottom: 30px;">
                <img loading="lazy" src="/{{ evento.img_video_path }}" style="width: 100%; max-width: 600px; height: auto; border-radius: 8px;">
            </div>

            <p style="font-size: 1.1rem; line-height: 1.8; color: #ddd; margin-bottom: 20px; text-align: justify; white-space: pre-line;">{{ evento.bio_corta }}</p>

            <div style="margin-top: 40px; border-top: 1px solid #333; padding-top: 25px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: center;">
                <span style="color: #fff; font-weight: bold; font-family: 'Oswald', sans-serif; text-transform: uppercase; margin-right: 10px;"><i class="fa-solid fa-share-nodes"></i> Compartir:</span>
                
                <a href="https://www.facebook.com/sharer/sharer.php?u=https://gothprods.com/evento/{{ evento.id }}" target="_blank" class="platform-btn" style="background: transparent; padding: 8px 15px; font-size: 0.95rem; border-radius: 4px; color: var(--accent-color); text-decoration: none; border: 1px solid var(--accent-color); min-width: auto; transition: all 0.3s;" onmouseover="this.style.background='var(--accent-color)'; this.style.color='#000';" onmouseout="this.style.background='transparent'; this.style.color='var(--accent-color)';"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
                
                <a href="https://www.instagram.com/goth_prods/" target="_blank" class="platform-btn" style="background: transparent; padding: 8px 15px; font-size: 0.95rem; border-radius: 4px; color: var(--accent-color); text-decoration: none; border: 1px solid var(--accent-color); min-width: auto; transition: all 0.3s;" onmouseover="this.style.background='var(--accent-color)'; this.style.color='#000';" onmouseout="this.style.background='transparent'; this.style.color='var(--accent-color)';"><i class="fa-brands fa-instagram"></i> Instagram</a>
                
                <button onclick="navigator.clipboard.writeText('https://gothprods.com/evento/{{ evento.id }}'); alert('Enlace copiado al portapapeles');" class="platform-btn" style="background: transparent; border: 1px solid var(--accent-color); padding: 8px 15px; font-size: 0.95rem; border-radius: 4px; color: var(--accent-color); cursor: pointer; text-decoration: none; min-width: auto; transition: all 0.3s;" onmouseover="this.style.background='var(--accent-color)'; this.style.color='#000';" onmouseout="this.style.background='transparent'; this.style.color='var(--accent-color)';"><i class="fa-solid fa-link"></i> Copiar Link</button>
            </div>
            
        </div>
    </main>
</body>
</html>
