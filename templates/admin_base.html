<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Goth Prods - Panel de Control</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --accent-color: #716d4a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1a1a;
            --text-main: #f5f5f5;
            --text-muted: #aaa;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: var(--bg-card); padding: 2rem; border-radius: 8px; border-top: 4px solid var(--accent-color); box-shadow: 0 4px 15px rgba(113, 109, 74, 0.1); }
        h1, h2, h3 { color: var(--accent-color); text-align: center; font-family: 'Outfit', sans-serif; text-transform: uppercase; letter-spacing: 2px;}
        label { font-weight: bold; margin-top: 20px; display: block; color: var(--text-muted); font-size: 0.9rem;}
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #222; color: white; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; font-family: inherit;}
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); outline: none; }
        button { width: 100%; padding: 15px; background: var(--accent-color); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 20px; text-transform: uppercase;}
        button:hover { background: #85834d; }
        .alert { padding: 12px; background: #333; color: #ffcc00; margin-bottom: 1rem; border-left: 4px solid #ffcc00; border-radius: 0 4px 4px 0;}
        .success { border-left-color: #4CAF50; color: #4CAF50; }
        .error { border-left-color: var(--accent-color); color: var(--accent-color); }
        .link { display: block; text-align: center; margin-top: 1.5rem; color: var(--accent-color); text-decoration: none; font-size: 0.9rem;}
        .link:hover { text-decoration: underline; }
        .navbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 1rem; margin-bottom: 2rem; }
        .logo-text { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 900; color: white;}
        .logo-text span { color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
