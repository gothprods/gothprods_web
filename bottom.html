            </div>
        </div>
    </div>
    {% endfor %}
    {% endfor %}

    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'es', includedLanguages: 'en,es', autoDisplay: false}, 'google_translate_element');
    }
    function changeLanguage(lang) {
      var select = document.querySelector('select.goog-te-combo');
      if (select) {
        select.value = lang;
        select.dispatchEvent(new Event('change'));
      }
      
      var btnsEs = document.querySelectorAll('.lang-btn-es');
      var btnsEn = document.querySelectorAll('.lang-btn-en');
      
      if (lang === 'es') {
          btnsEs.forEach(function(btn) {
              btn.style.background = 'var(--accent-color)';
              btn.style.color = '#000';
              btn.style.border = 'none';
          });
          btnsEn.forEach(function(btn) {
              btn.style.background = '#333';
              btn.style.color = '#fff';
              btn.style.border = '1px solid var(--accent-color)';
          });
      } else {
          btnsEn.forEach(function(btn) {
              btn.style.background = 'var(--accent-color)';
              btn.style.color = '#000';
              btn.style.border = 'none';
          });
          btnsEs.forEach(function(btn) {
              btn.style.background = '#333';
              btn.style.color = '#fff';
              btn.style.border = '1px solid var(--accent-color)';
          });
      }
    }
    
    // MutationObserver para evitar que Google Translate empuje el body hacia abajo
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (document.body.style.top) {
                document.body.style.top = '';
            }
        });
    });
    observer.observe(document.body, { attributes: true, attributeFilter: ['style'] });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="app.js"></script>
</body>
</html>
