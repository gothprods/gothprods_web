name: Keep Render App Awake

on:
  schedule:
    # Ejecuta cada 14 minutos para evitar los 15 minutos de inactividad de Render
    - cron: '*/14 * * * *'
  workflow_dispatch: # Permite ejecutar el ping manualmente si se necesita

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Goth Prods Website
        run: curl -s https://gothprods-web.onrender.com > /dev/null
        
      - name: Prevent Github Actions from suspending cron (60 days of inactivity)
        uses: gautamkrishnar/keepalive-workflow@v2
