<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goth Prods | Tu portal de Cultura Metalera</title>
    <meta name="description" content="Goth Prods es la productora de contenidos de Metal más imponente. Encuentra noticias, bandas de la semana, galería nocturna, reseñas exclusivas y el podcast Metal Pulse.">
    <meta name="keywords" content="metal, goth prods, heavy metal, rock, podcast metal, noticias metal, bandas, reseñas, conciertos">
    <meta name="author" content="Goth Prods">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Redes Sociales (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gothprods.com/">
    <meta property="og:title" content="Goth Prods | Tu portal de Cultura Metalera">
    <meta property="og:description" content="Goth Prods es la productora de contenidos de Metal más imponente. Encuentra noticias, reseñas exclusivas y el podcast Metal Pulse.">
    <meta property="og:image" content="https://gothprods.com/assets/viking.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://gothprods.com/">
    <meta property="twitter:title" content="Goth Prods | Tu portal de Cultura Metalera">
    <meta property="twitter:description" content="Goth Prods es la productora de contenidos de Metal más imponente. Encuentra noticias, reseñas exclusivas y el podcast Metal Pulse.">
    <meta property="twitter:image" content="https://gothprods.com/assets/viking.jpg">

    <!-- Favicons -->
    <link rel="icon" href="assets/viking.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="assets/viking.jpg">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="navbar">
        <div class="left-controls">
            <img src="assets/viking.jpg" alt="Viking Icon" class="viking-icon">
            {% if settings.get('hamburger_active', '1') == '1' %}
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            {% endif %}
        </div>
        <div class="logo">
            <a href="#home"><img src="assets/logo-new.png" alt="Goth Prods Logo" class="logo-img"></a>
        </div>
        <nav class="header-socials">
            <a href="https://www.tiktok.com/@goth_prods" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://www.facebook.com/Goth-Prods-104237088306624/" target="_blank"><i
                    class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/goth_prods/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.youtube.com/@gothprods44" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://podcasts.apple.com/mx/podcast/goth-prods/id1606324255?l=en" target="_blank"><i
                    class="fa-solid fa-podcast"></i></a>
            <a href="https://open.spotify.com/show/2hnlgkcGNl9GOAPa0WT9HW?si=7e9b95f203464fe6" target="_blank"><i
                    class="fa-brands fa-spotify"></i></a>
            <div class="lang-controls" style="display: flex; gap: 5px; margin-left: 10px; align-items: center; border-left: 1px solid #444; padding-left: 10px;">
                <i class="fa-solid fa-globe" style="font-size: 1.2rem; color: #fff; margin-right: 2px;" title="Cambiar Idioma"></i>
                <button class="lang-btn-es" onclick="changeLanguage('es')" style="background: var(--accent-color); color: #000; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; transition: all 0.3s ease;">🇲🇽 ES</button>
                <button class="lang-btn-en" onclick="changeLanguage('en')" style="background: #333; color: #fff; border: 1px solid var(--accent-color); padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; transition: all 0.3s ease;">🇺🇸 EN</button>
            </div>
        </nav>
    </header>

    <div id="sidebar-menu" class="sidebar">
        <div class="sidebar-header">
            <img src="assets/logo.png" alt="Goth Prods Logo" class="sidebar-logo">
            <div class="close-btn" id="close-menu">&times;</div>
        </div>
        <ul class="sidebar-links">
            <li><a href="#highlights">El Pit</a></li>
            <li><a href="#shows">La Galería Nocturna</a></li>
            <li><a href="#metal-pulse">Metal Pulse</a></li>
            <li><a href="#reviews">Reseñas de Conciertos</a></li>
